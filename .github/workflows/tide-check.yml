name: tide-check

on:
  pull_request:
    paths:
      - "tide/**"
      - ".github/workflows/tide-check.yml"
  push:
    branches: [main]
    paths:
      - "tide/**"
      - ".github/workflows/tide-check.yml"

jobs:
  tide-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: tide/scripts/check-release.sh
