[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tide-core"
version = "0.1.0"
description = "Tide CLI for compiling, testing, and running MCP policy projects"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
keywords = ["mcp", "ai-agents", "policy", "guardrails"]

[project.urls]
Homepage = "https://github.com/rippletideco/rippletide/tree/main/tide"
Repository = "https://github.com/rippletideco/rippletide"
Issues = "https://github.com/rippletideco/rippletide/issues"

[project.scripts]
tide = "tide_core.cli:main"

[tool.setuptools]
packages = ["tide_core"]
